<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>政务数据大脑</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="ui-spec-b">
  <header class="global-header">
    <div class="global-header-inner">
      <a href="#/p1-workbench" class="global-brand">
        <span class="gov-logo-mark" aria-hidden="true"></span>
        <div>
          <div class="brand-title">政务数据大脑</div>
          <div class="brand-subtitle">让数据共享少填、快办、可追溯</div>
        </div>
      </a>
      <div id="deployment-label" class="deployment-label" hidden></div>
      <nav class="helper-links" aria-label="顶部辅助入口">
        <a id="zw-login-nav-link" href="#/login" title="前往统一身份登录" aria-label="前往统一身份登录">登录</a>
      </nav>
      <div class="global-actions">
        <div id="identity-label" class="identity-label" aria-live="polite">当前账号</div>
        <div id="role-control" class="role-control" hidden>
          <span>当前岗位</span>
          <label class="sr-only" for="role-switch">切换岗位身份</label>
          <select id="role-switch" class="role-select">
            <option value="r1">上级业务需求发起人</option>
            <option value="r2">审批承接人员</option>
            <option value="r3">镇街填报人员</option>
            <option value="r4">村社区填报人员</option>
            <option value="r5">审核汇总人员</option>
            <option value="r6">台账管理员</option>
            <option value="r7">目录管理员</option>
            <option value="r8">合规与减负治理</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <main class="app-shell-main">
    <section class="app-frame app-frame-live">
      <div id="app" class="min-w-0"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <span>政务数据大脑</span>
      <span id="legal-notice" hidden></span>
    </div>
  </footer>

  <style>
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .min-w-0 {
      min-width: 0;
    }
  </style>

  <script src="/js/pages.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
