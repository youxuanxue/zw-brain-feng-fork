<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>政务数据大脑 · zw-brain</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'zw-primary': '#12386f',
            'zw-primary-2': '#1d5a9f',
            'zw-accent': '#c79a4b',
            'zw-bg': '#f4f7fb',
            'zw-bg-soft': '#eef4fb',
            'zw-card': '#ffffff',
            'zw-ink': '#18263a',
            'zw-mute': '#66758a',
            'zw-line': '#d7e0ea',
            'zw-link': '#1d4f91',
            'zw-ai': '#155e75',
            'zw-ai-soft': '#eef8fb'
          },
          boxShadow: {
            'gov': '0 18px 45px rgba(15, 40, 72, 0.10)',
            'gov-soft': '0 8px 22px rgba(15, 40, 72, 0.07)'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-zw-bg text-zw-ink antialiased min-h-screen flex flex-col">
  <header class="global-header text-white sticky top-0 z-30">
    <div class="max-w-screen-2xl mx-auto px-8 py-5 flex items-center gap-8 flex-wrap 2xl:flex-nowrap">
      <a href="#/p1-workbench" class="global-brand flex items-center gap-4 min-w-[320px]">
        <span class="gov-logo-mark"></span>
        <div>
          <div class="brand-title">政务数据大脑</div>
          <div class="brand-subtitle">数据资源一屏统览 · 共享交换一链办理 · 治理审计全程留痕</div>
        </div>
      </a>
      <div class="global-actions ml-auto flex items-center gap-4 flex-wrap justify-end">
        <div class="role-control flex items-center gap-2 opacity-95">
          <span>当前身份</span>
          <select id="role-switch" class="role-select focus:outline-none focus:ring-2 focus:ring-white/20">
            <option value="r1">上级业务需求发起人</option>
            <option value="r2">审批承接人员</option>
            <option value="r3">镇街填报人员</option>
            <option value="r4">村社区填报人员</option>
            <option value="r5">审核汇总人员</option>
            <option value="r6">台账管理员</option>
            <option value="r7">目录管理员</option>
            <option value="r8">合规与减负治理</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-screen-2xl mx-auto w-full px-6 py-6">
    <section class="app-frame app-frame-live">
      <div id="app" class="min-w-0"></div>
    </section>
  </main>

  <footer class="border-t border-zw-line bg-white/75 backdrop-blur-sm">
    <div class="max-w-screen-2xl mx-auto px-6 py-3 text-xs text-zw-mute flex items-center justify-between gap-4 flex-wrap">
      <span>政务数据大脑</span>
      <span>数据共享、基层减负、治理审计一体化运行</span>
    </div>
  </footer>

  <script src="/js/pages.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
