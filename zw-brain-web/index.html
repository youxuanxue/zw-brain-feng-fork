<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>政务数据大脑</title>
  <link rel="icon" href="/assets/zw-brain-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="ui-spec-b">
  <header class="global-header">
    <div class="global-header-inner">
      <a href="#/workbench" class="global-brand">
        <svg
          class="gov-logo-mark"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 32 32"
          width="22"
          height="22"
          fill="none"
          aria-hidden="true"
          focusable="false"
        >
          <defs>
            <linearGradient id="zwLogoGrad" x1="5" y1="4" x2="27" y2="28" gradientUnits="userSpaceOnUse">
              <stop stop-color="#006be6"/>
              <stop offset="1" stop-color="#0048a8"/>
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="7" fill="url(#zwLogoGrad)"/>
          <circle cx="16" cy="16" r="11.85" stroke="rgba(255,255,255,0.32)" stroke-width="1" stroke-dasharray="2.2 2.8" fill="none"/>
          <g stroke="#fff" stroke-opacity="0.92" stroke-width="1.85" stroke-linecap="round">
            <path d="M16 5.8v20.4M5.8 16h20.4"/>
          </g>
          <circle cx="16" cy="16" r="3.8" fill="#fff" fill-opacity="0.96"/>
          <circle cx="16" cy="7.5" r="2.65" fill="#fff" fill-opacity="0.96"/>
          <circle cx="24.5" cy="16" r="2.65" fill="#fff" fill-opacity="0.96"/>
          <circle cx="16" cy="24.5" r="2.65" fill="#fff" fill-opacity="0.96"/>
          <circle cx="7.5" cy="16" r="2.65" fill="#fff" fill-opacity="0.96"/>
          <circle cx="16" cy="16" r="1.69" fill="#009688"/>
        </svg>
        <div>
          <div class="brand-title">政务数据大脑</div>
          <div class="brand-subtitle">让数据共享少填、快办、可追溯</div>
        </div>
      </a>
      <div id="deployment-label" class="deployment-label" hidden></div>
      <nav class="helper-links" aria-label="顶部辅助入口">
        <button id="zw-login-button" type="button" class="header-auth-link" title="前往统一身份登录" aria-label="前往统一身份登录" onclick="window.ACTIONS.startIafLogin(event)">登录</button>
      </nav>
      <div class="global-actions">
        <div id="user-menu" class="user-menu" hidden>
          <button id="user-menu-button" type="button" class="user-menu-button" aria-haspopup="true" aria-expanded="false" onclick="window.ACTIONS.toggleUserMenu(event)">
            <span id="user-menu-name">当前用户</span>
          </button>
          <div id="user-menu-panel" class="user-menu-panel" hidden>
            <a href="#/profile" class="user-menu-item">个人中心</a>
            <button type="button" class="user-menu-item" onclick="window.ACTIONS.logout(event)">退出登录</button>
          </div>
        </div>
        <div id="identity-label" class="identity-label" aria-live="polite">当前账号</div>
        <div id="role-control" class="role-control" hidden>
          <span>当前岗位</span>
          <label class="sr-only" for="role-switch">切换岗位身份</label>
          <select id="role-switch" class="role-select">
            <option value="ROLE_ORGAN_OPERATER">部门操作员</option>
            <option value="ROLE_ORGAN_MANAGER">部门管理员</option>
            <option value="ROLE_BUSIAUDIT">业务运营员（主管部门）</option>
            <option value="ROLE_SECURITY_AUDIT">安全审计员</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <main class="app-shell-main">
    <section class="app-frame app-frame-live">
      <div id="app" class="min-w-0"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <span>政务数据大脑</span>
      <span id="legal-notice" hidden></span>
    </div>
  </footer>

  <style>
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .min-w-0 {
      min-width: 0;
    }
  </style>

  <script src="/js/pages.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
