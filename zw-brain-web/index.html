<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>政务数据大脑 · zw-brain</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="ui-spec-b">
  <header class="global-header">
    <div class="global-header-inner">
      <a href="#/p1-workbench" class="global-brand">
        <span class="gov-logo-mark" aria-hidden="true"></span>
        <div>
          <div class="brand-title">政务数据大脑</div>
          <div class="brand-subtitle">数据资源检索 · 共享办事 · 治理审计</div>
        </div>
      </a>
      <div class="global-actions">
        <div class="role-control">
          <span>当前身份</span>
          <label class="sr-only" for="role-switch">切换岗位身份</label>
          <select id="role-switch" class="role-select">
            <option value="r1">上级业务需求发起人</option>
            <option value="r2">审批承接人员</option>
            <option value="r3">镇街填报人员</option>
            <option value="r4">村社区填报人员</option>
            <option value="r5">审核汇总人员</option>
            <option value="r6">台账管理员</option>
            <option value="r7">目录管理员</option>
            <option value="r8">合规与减负治理</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <main class="app-shell-main">
    <section class="app-frame app-frame-live">
      <div id="app" class="min-w-0"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <span>政务数据大脑</span>
      <span>党政机关网站标识 · 我为政府网站找错 · ICP / 公安备案 · 站点地图（要素以主管单位清单为准）</span>
    </div>
  </footer>

  <style>
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .min-w-0 {
      min-width: 0;
    }
  </style>

  <script src="/js/pages.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
