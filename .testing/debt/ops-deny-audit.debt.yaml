slug: ops-deny-audit
title: "policy 门 deny 不发审计事件（越权尝试无痕；ops-service-invocation S6 残差）"
date: 2026-06-03
severity: medium
owner: 产品研发负责人
# Where:       zw_brain/domain/policy.py enforce_manifest_policy（brain.py:346 调用）
#              —— 所有 read/write capability 共用的 policy 门。
# Implication: 未授权角色访问被拒时，enforce_manifest_policy 在任何审计发射（run_traced_read）
#              之前就 raise AccessDeniedError，故 deny 不产生 policy-decision 审计事件。
#              一次越权尝试在系统不留任何审计痕迹 —— 与 ROLE_SECURITY_AUDIT「越权可追溯」预设
#              冲突（精品意识缺口）。注：D4 字面约束「有审计事件时强制同步落库（写失败熔断）」，
#              未规定「每次 deny 必须产生事件」，故现状非 D4 硬违反，属可记账延后项。
# Why deferred: 补 deny-audit 要动共用 policy 门，blast radius = 每个 capability 的每次 deny；
#              且涉及 deny 审计在 deny 早期 sink 是否就绪、deny 审计写失败要不要把 deny 本身
#              一并熔断（D4 熔断语义）等真问题。这是独立架构决策，不该夹带进 Wave 0 P0 接线 PR。
trigger: "共用 policy 门审计化立项 → 在 policy 门/entry 边界统一发射 policy decision=deny 审计事件 + 决定熔断语义 + 业务方 sign-off。"
assert:
  # 决策门延后，无可机械断言的 code 条件（external 须 owner+trigger，trigger 触发即升级）。
  kind: external
