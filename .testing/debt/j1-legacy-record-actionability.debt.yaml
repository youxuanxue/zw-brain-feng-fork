slug: j1-legacy-record-actionability
title: "M0 导入的真实申请缺运行时实体图（无 delivery task / 不在内存快照）→ 凭据页 422、动作面半残"
date: 2026-06-01
severity: medium
owner: 产品研发负责人
# 本地走查（PR #181 后，rebase #182/#183）发现：新流程产生的 REQ-* 申请有完整运行时实体图
# （delivery task / grant snapshot / 内存快照成员），而 M0 导入的真实历史申请（hex id）只有
# application_record 行，缺这些实体 → credential.query 对其抛 NotFoundError(422)（_get_credential
# 找不到 delivery task），P4 凭据页只能诚实报「暂无可用凭据信息」。撤回/暂停已由 R-004 改为经
# application_repo 真落库（对真实申请也生效）；但「凭据签发/调用样例/调用记录」这条交付链对历史
# 导入申请仍走不通。这是「迁移即一次性引导、非运行时」(project_legacy_import_migration_only) 的
# 直接后果。**待业务/架构裁决**：历史导入申请是否应被回填运行时实体图以支持完整在线动作（撤回/
# 暂停/凭据/交付），还是定性为只读历史、UI 对其隐藏在线动作入口（无死按钮原则）。裁决前 UI 已做到
# 诚实（动作真落库或诚实报错，不假成功、不漏原始 HTTP 码）。
trigger: "业务/架构裁决历史导入申请的可动作性 → 若需在线动作则回填 delivery task / grant snapshot 等运行时实体（或建 application_record→delivery 的解析回源）；若定性只读则 UI 对历史导入申请隐藏撤回/暂停/凭据入口（无权/不适用=不可见）。裁决落 D-编号后据此收口。"
assert:
  # 纯产品/架构裁决依赖，无单文件机械锚点；保持 external，由 trigger 人工升级。
  kind: external
