slug: resource-schema-keying-reconcile
title: "字段数据模型视图覆盖率残留：read-path bridge 已把 2%→27%，余 73% 资源源 dump 无 schema 映射（上游数据缺供）"
date: 2026-06-02
severity: medium
owner: 产品研发负责人
# 【已部分修复 — read-path bridge】PR #185 实地走查发现：metadata.schema.query / P2「字段数据
# 模型」按 resource_code 直查 resource_schema_snapshot，但 snapshot 按 db_meta_table.meta_id 入库，
# 与 resource_asset.resource_code 不同键 → 直查仅 5/186（2.7%）命中。
# 后续 PR（fix/resource-schema-keying-bridge）在**读路径**（_query_metadata_schema + 新 repo
# list_schema_snapshots_by_binding_codes）加桥接：直查空时经 resource_schema_mapping(active)
# 的 binding_code → resource_schema_snapshot.binding_code 解析 → 覆盖率 5→52/186（≈27%，10×）。
# 该桥接是只读查询，不碰 §9.5 adapter 写区、不重导入。
# 【残留 — 上游数据缺供，本债保留项】186 资源里仅 48 条有任何 resource_schema_mapping 行；其余
# 138 条（73%）在源 dump 里根本没有 schema 映射 → 读路径无法解决，这些资源仍诚实显「该资源暂无
# 登记的字段数据模型」（空态正确，非误显/非静默吞错）。要再提升须数据/业务侧在上游补 schema 映射
# （dsp_metaresource 与 catalog 资源的列级 link）或补 dump，非工程读路径可解。
# 这是 legacy-import 一次性引导的直接后果（project_legacy_import_migration_only），非 #185 引入。
trigger: "数据/业务侧在上游补齐 138 个无 schema 映射资源的 dsp_metaresource→catalog 资源列级 link（或补 dump 后重导），使 resource_schema_mapping 覆盖更多 resource_asset；补齐后桥接自动放大覆盖率（读路径已就绪，无需再改代码）。届时把本 assert 从 external 升级为现算（如 SQL join 命中率门槛）并按实际覆盖率关债或降级。"
assert:
  # 残留是上游数据缺供（138 资源源 dump 无 schema 映射），无单文件机械锚点；保持 external，由数据侧补齐后人工升级为现算。
  kind: external
