  验证：guard 真命中测试 5/5 通过；现有 agentruntime 单测 10/10 不退化（mode 默认 embedded）；
  mode=http 占位正确 raise NotImplementedError；preflight 段77 ok（接缝收口 2 文件）。
  GATE D33.d 命名筛查：trust_level 双命名空间（T1 须 rename 一方）/ skill→capability（AR
  skill_id 留协议字符串）/ anp-agent v1.2 钉死。
  搬运行时全量（AgentRuntimeClient HTTP adapter / A 类 manifest 改 api-tools / co-located
