  （防 guard 假绿：真实 SDK import 样本逐条命中、封装包/软探测/注释不误报、临时树越界真抓）；
  ③ZW_BRAIN_AGENT_RUNTIME_MODE 占位管线（config.py agent_runtime_mode()/base_url()，默认
  embedded 零行为变更；service.py http 分支 NotImplementedError 占位，挂点就位不静默启用）；
  ④decision-log D68；⑤spike 报告 docs/agent-runtime/copilot-out-of-process-spike.md。
  spike 结论（身份传递原生可行）：AR `${user_credential:REF}` 按 (subject_user_id, ref)
