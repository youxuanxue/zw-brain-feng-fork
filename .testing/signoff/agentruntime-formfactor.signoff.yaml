  只差信任级/策略）；②近路 vs T1 的轴从「A 类/B 类域」更正为「内部团队编写 vs 外部第三方
  onboarding」（A/B 智能体未来一周一起突增，团队写的都走近路）。根因＝两产品快迭代下嵌入
  三轴耦合（依赖 py3.12.12 pyc + langchain/langgraph 闭包压进 zw-brain 镜像 / 版本锁步 /
  同进程故障域）+ 后台线程非真隔离（跑飞 agent 拖垮 REST）。
  本轮交付（地基 + spike，零行为变更）：①§8.2 line 810 改写单一模型 + 更正 R4 归因
  （R4 约束控制面范围、非进程拓扑）；②preflight 段77 接缝导入守卫
  scripts/check_agent_runtime_import_confinement.py（`from agent_runtime` 只许接缝两文件
