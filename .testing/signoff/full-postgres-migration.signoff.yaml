scope: full-postgres-migration
signed_by: 薛娇（产品研发负责人）
date: 2026-06-19
kind: 决策签字
evidence: >-
  全盘迁移 PostgreSQL、彻底移除 SQLite（架构+数据安全门，反转 D58 sqlite-coexist；全文
  docs/decisions/full-postgres-migration-D66.md）。本会话内负责人多次显式裁决「要上生产，
  全盘 pg 势在必行」并逐版批准计划。裁决：单一引擎 PostgreSQL = 测试即生产引擎，消除
  「测试证 sqlite / 发布跑 pg」测量假象（撞 D11）。落地——D66.a 运行时 PG-only，db.py 对
  sqlite:// URL 与 ZW_BRAIN_DB_PATH 双 fail-closed raise（旋钮永不静默存活）；D66.b 审计库
  原生 sqlite3 → raw psycopg 落同实例独立 audit schema（守 D4 + 去 ORM 耦合）；D66.c conftest
  每测试 CREATE DATABASE TEMPLATE 空克隆隔离 + tests/_pg_realistic 真实数据模板 fixture +
  惰性 durable 审计 sink；D66.d 防回潮守卫 scripts/check_no_sqlite.py + preflight 段74；
  D66.e PROD BLOCKER binding_code String(64)→128（PG 揪出、SQLite 一直掩盖的真实数据截断，
  models.py + baseline 迁移同步加宽）；D66.f CI test/legacy-import-smoke/e2e 各加 postgres:16
  service、折并 pg-smoke。生产数据 = old/10示例数据 MySQL dump 经 legacy-import 灌 PG。
  验证（真 PostgreSQL）：全量 pytest 套件多轮 PYTEST_EXIT=0 / 0 失败；legacy-import 真 dump
  灌 PG verify 0 未解析 / 0 冲突、零截断（realistic 模板 catalog 1222 / application 258 /
  topic_package 113）；真 Playwright 走查 live PG 部署 123 业务流通过、webui twin_browser_pages
  13 passed（权威 --with-e2e）；check_no_sqlite 0 残留 / 936 文件；ruff 全过；preflight PASS。
  影响：本地/CI 跑测试从此强依赖 PG 在线（既定代价）；流程/状态机/角色语义零变更。须负责人
  sign-off，本条即是。
decision_only: true
covers: []
