# alembic.ini — D58（反转 D23 二次升级；详见 docs/decisions/alembic-migration-reintroduction-D58.md）
# forward-migration 取代冷启动 drop&recreate；存量库 baseline-stamp 不 DROP。
# sqlalchemy.url 留空：实际 URL 由 alembic/env.py 在运行时从 zw_brain.shared.db.get_database_url()
# 解析（ZW_BRAIN_DATABASE_URL / ZW_BRAIN_DB_PATH 环境变量注入），禁在此硬编码连接串（架构约束：配置走环境变量）。

[alembic]
script_location = alembic
prepend_sys_path = .
# path_separator=os 消除 alembic 1.18 的 legacy-split DeprecationWarning（按 os 路径分隔符切分）
path_separator = os
# %% 转义供 strftime；version 文件名带时间戳便于审计排序
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
