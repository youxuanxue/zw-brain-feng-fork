schema_version: 1
id: e5-webui-projections
one_liner: 前端工程化重建 + 8 页面成品化 + 5 消费面投影器派生

core_goal: |
  Vue3+Vite 骨架与 8 主页面（P1-P5/P7 + B1.1/B1.2）已在 main land，dist-vite 由 REST 托管。
  当前阶段从「解锁并行开发」转为「浏览器可闭环」：写操作必须跟随顶栏岗位、P3 审批枚举对齐后端、
  P5/P7 子路由去占位、NL 减摩接 E1 已 land 的 cap（非 fixture 兜底）、Playwright 固化 2026-05-25
  端到端验收结论防回归。
  5 消费面投影器 + CLI/MCP/A2A 投影已就位；headless J1 脚本需去假绿。
  共享纪律见 .twin/README.md（撞 M0 墙路径：projections.py 缺 provider 收件箱计数等）。

acceptance_criteria:
  - id: AC1
    statement: WebUI 源码 + 构建管线重建（Vue3+Vite），保留 8 页面路由
    evidence_type: zw-brain-web/src + package.json + vite.config + dist-vite + npm run dev 热重载
  - id: AC2
    statement: 8 页面成品化装载 sd-default 真实数据，浏览器写路径可闭环，遵守 R12 工程术语黑名单
    evidence_type: 8 主页面 live 截图 + Playwright 冒烟 + preflight 段 24 不报红 + 子路由占位清单收敛
  - id: AC3
    statement: 5 消费面投影器从单一 Registry 派生——WebUI 页面注册 / REST OpenAPI / CLI spec / MCP manifest / A2A card
    evidence_type: scripts/export_agent_contract.py --check + check_no_hand_maintained_projection 不报红
  - id: AC4
    statement: CLI / MCP / A2A 生产硬化——CLI headless J1 真绿；MCP/A2A 至少可被 Cursor/Claude 调
    evidence_type: scripts/headless_j1_demo.sh 失败步 exit 非 0 + MCP 连通测试 + A2A card 可发现
  - id: AC5
    statement: 嵌入式自然语言加速器在 P2/P3/B1.1/B1.2 落位且 live 接线，反约束遵守
    evidence_type: 4 组件 live 解析截图 + 不替代结构页面本体 + 不接 nl.accelerator.parse fixture 为主路径
  - id: AC6
    statement: 6 人不再被前端阻塞——Playwright harness + ≥2 个其他 worker UI PR land
    evidence_type: tests/e2e 可 CI 运行 + E1/E2 UI 协作 PR merged

non_goals:
  - 不写 J1/J2 业务后端（归 E1/E2）
  - 不写 B1 后台业务后端（归 E4）
  - 不写 Wave 2 三引擎数据模型（归 E3）
  - 不接外部依赖大屏 / 指挥中心（基线 §1.3 不做）
  - 不为 MCP / A2A 协议对称推迟 WebUI 主旅程交付（基线 §6.1）
