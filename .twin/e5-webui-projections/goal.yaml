schema_version: 1
id: e5-webui-projections
one_liner: 前端工程化重建 + 8 页面成品化 + 5 消费面投影器派生

core_goal: |
  解锁项：zw-brain-web 当前是 316KB JS bundle（app.js 67KB + pages.js 231KB + auth.js 16KB）+ index.html
  + css，无源码、无构建管线，6 人无法并行开发前端。本 worker 必须在 2 周内 land 现代前端骨架
  （Vue3+Vite 或 React+Vite 二选一）+ 8 页面（P1-P5/P7 + B1.1/B1.2）+ 5 消费面投影器
  （扩展 scripts/export_agent_contract.py 派生 WebUI 页面注册 / OpenAPI / CLI spec / MCP manifest /
  A2A card）+ CLI/MCP/A2A 生产硬化 + 嵌入式自然语言加速器（P2/P3/B1.1/B1.2）。
  WebUI 装载 sd-default 真实数据后必须像真产品，不是骨架。
  共享纪律见 .twin/README.md（撞 M0 墙路径：projections.py 缺 search / 共享专题 / 运营统计投影时）。

acceptance_criteria:
  - id: AC1
    statement: WebUI 源码 + 构建管线重建（Vue3+Vite 或 React+Vite 二选一），保留 8 页面路由
    evidence_type: zw-brain-web/src 源码目录 + package.json + vite.config + 构建产物等价于现有 bundle + npm run dev 热重载
  - id: AC2
    statement: 8 页面成品化（P1-P5/P7 + B1.1/B1.2）装载 sd-default 真实数据，遵守 R12 工程术语黑名单
    evidence_type: 8 页面截图（含真实数据） + preflight 段 24 不报红 + check_ui_spec_b 8 页面 cap 不报红
  - id: AC3
    statement: 5 消费面投影器从单一 Registry 派生——WebUI 页面注册 / REST OpenAPI / CLI spec / MCP manifest / A2A card
    evidence_type: scripts/export_agent_contract.py 扩展输出 + 5 投影目录全自动生成 banner + check_no_hand_maintained_projection 不报红
  - id: AC4
    statement: CLI / MCP / A2A 生产硬化——CLI 能 headless 跑完 J1 全链路用 sd-default 真数据；MCP/A2A 至少能被 Cursor/Claude 调
    evidence_type: scripts/headless_j1_demo.sh + MCP server 真实连通测试 + A2A card 可发现
  - id: AC5
    statement: 嵌入式自然语言加速器（§5.4.4 减摩组件）在 P2/P3/B1.1/B1.2 落位，反约束遵守
    evidence_type: 4 个 AI 减摩组件截图 + 不替代结构页面本体的反约束自检
  - id: AC6
    statement: 6 人不再被前端阻塞——E1/E2/E3/E4 的 UI 任务能并行接入
    evidence_type: 至少 2 个其他 worker 的 UI 任务 PR 在本 worker 完成后 1 周内 land

non_goals:
  - 不写 J1/J2 业务后端（归 E1/E2）
  - 不写 B1 后台业务后端（归 E4）
  - 不写 Wave 2 三引擎数据模型（归 E3）
  - 不接外部依赖大屏 / 指挥中心（基线 §1.3 不做）
  - 不为 MCP / A2A 协议对称推迟 WebUI 主旅程交付（基线 §6.1）
