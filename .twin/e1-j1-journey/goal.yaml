schema_version: 1
id: e1-j1-journey
one_liner: 让 J1 找数→用数旅程在 sd-default 真实数据上跑通含异议 5 维度的完整闭环

core_goal: |
  后端 F1-F9 + CLI 演示脚本已在 main land（异议 5 维、供需 6 步、P4 三语样例、3 处减摩 cap、customer_demo_j1.py exit 0）。
  PR #106 后浏览器 **前半段已通**：P2 三类资源可搜、P3 审批写路径 + 枚举对齐、P4 凭据子页 Key + 三语样例 +「已签发」、NL 减摩 live。
  **仍缺浏览器闭环（P0）**：P3 **无** J1 异议发起/跟踪入口；P3 **无** 供需对接 6 步可见入口——30 分钟演示无法在 UI 等价复现 customer_demo_j1 异议段（STEP-7~12）。
  下一阶段：与 E5 F13/F14 协作补齐上述两入口 → E1 F11 业务方 sign-off。
  共享纪律见 .twin/README.md（撞 M0 墙路径：catalog_metadata.py / objection.py）。

acceptance_criteria:
  - id: AC1
    statement: J1 异议处理 5 维度（authz/catalog/content/resource/use）独立状态机 + evaluate/process 辅助流程在 sd-default 真实异议历史上完整闭环
    evidence_type: tests/integration/test_wave1_objection_5dim_state.py 全绿 + 真实 dump 跑通的 e2e 截图
  - id: AC2
    statement: J1 供需对接子流程 6 步（找不到数据→登记需求→智能推荐失败→人工需求登记→部门响应→订阅）可跑
    evidence_type: tests/e2e supply-demand feature 全绿 + .testing/waves/wave-1-j1-j2-closed-loop/features/j1-supply-demand-meta-merge.feature 实现
  - id: AC3
    statement: P4 凭据领取生产化——浏览器可领 Key + 三语样例 + 配额 + 监控入口，状态中文正确
    evidence_type: P4 页面截图（issued 显示已签发） + 凭据下发审计事件 + Playwright 冒烟
  - id: AC4
    statement: P2/P3/P4 三处减摩组件 live 接线（非 fixture 为主路径），反约束遵守
    evidence_type: 三组件 live 解析截图 + search.intent.parse 等 cap 调用 log
  - id: AC5
    statement: 30 分钟 J1 浏览器演示含异议，业务方在 sd-default 真数据上 sign-off
    evidence_type: Playwright J1 冒烟 + customer_demo_j1.sh 真绿 + business-signoff

non_goals:
  - 不做 J2 编目/上架/发布（归 E2）
  - 不做 Wave 2 三引擎中的审批流可视化编辑器（归 E3）
  - 不做 B1 后台合规/接入扩展中心（归 E4）
  - 不重做 zw-brain-web 构建管线（E5 已 land；UI 缺陷归 E5 F9-F12）
  - 不实现 AgentRuntime 外部 Agent 接入（归 E4 触发式）
