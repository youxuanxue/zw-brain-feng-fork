schema_version: 1
id: e6-platform-m0
one_liner: brain.py 拆分 + 推理客户端生产化 + M0 现场实施面 UI + CI/CD（兼 M0 PR @reviewer）

core_goal: |
  P0 解锁项 + 平台底座 + M0 维护责任。让其他 5 人不被 brain.py 8368 LOC 单文件 merge 阻塞；
  让 shared/inference/client 从 187 LOC mock 升级为真实接入集团推理平台 SDK；让 M0 实施工程师
  能在客户现场用浏览器跑完 12 步主旅程（当前仅 CLI）；补完 M0 的 7 个 dump mapper 覆盖判定表
  （dsp_basesubject / dsp_monitor / dsp_message / dsp_block / dsp_metaresource graphdb / dsp_pdf
  / dsp_app_center —— 逐一确认 §3.4/§5.6 不复造 or 漏做）；保证 search / 共享专题 / 质量 / 血缘 /
  运营统计 5 类投影状态可见 + 失败摘要可读；落地 Wave 2/3/4 测试 features；CI/CD + 客户机房部署 +
  对接集团运维监控。**M0 PR @reviewer 责任**：其他 worker 提的 M0 PR 通过 GitHub @ E6 持有人 review，
  不依赖定期同步会议。

acceptance_criteria:
  - id: AC1
    statement: brain.py 拆分——8368 LOC 单文件 → command/dispatch.py 薄分发器（≤500 LOC）+ command/handlers/{j1,j2,b1,infra}/ 分目录
    evidence_type: 拆分 PR diff + tests/integration 不退化 + 其他 5 worker 不再因 brain.py merge 撞车
  - id: AC2
    statement: 推理客户端生产化——187 LOC mock 升级为真实接入集团推理平台 SDK，保留 mock 模式给本机
    evidence_type: tests/integration/test_inference_client.py + 真实推理调用 e2e + preflight 段 10 不报红
  - id: AC3
    statement: M0 现场实施面 UI——12 步主旅程从 CLI 升级为浏览器可视化（M0 实施人能现场跑）
    evidence_type: M0 浏览器实施面 e2e + 12 步可视化截图 + 客户现场实施人 sign-off
  - id: AC4
    statement: M0 mapper 覆盖判定表——7 个未做 mapper 逐一确认 §3.4/§5.6 不复造 or 漏做，补进 M0 文档
    evidence_type: docs/deployment/m0-mapper-coverage.md 新增 + 真实 7 dump 字段逐一过 + 漏做项的补 mapper PR
  - id: AC5
    statement: 5 类投影状态可见——search / 共享专题 / 质量 / 血缘 / 运营统计 投影状态 + 失败摘要可读
    evidence_type: tests/integration/test_projection_status.py + B1.1 投影状态 panel（与 E4 协作）
  - id: AC6
    statement: Wave 2/3/4 测试 features 落地 + 测试 pyramid trusted-payload helper 改造
    evidence_type: .testing/waves/wave-{2,3,4} features 全部填充 + tests/_trusted_payload.py + R-001 类点护栏
  - id: AC7
    statement: CI/CD + 客户机房部署 + 监控对接集团运维监控
    evidence_type: scripts/deploy_*.sh + Dockerfile_v1.0.0 升级 + 客户机房 dry-run sign-off + 监控 dashboard 接入证据

non_goals:
  - 不写 J1/J2 业务功能（归 E1/E2）
  - 不写 Wave 2 三引擎数据模型（归 E3）
  - 不写 B1.1/B1.2 业务面（归 E4，本 worker 只提供 5 投影状态）
  - 不重建 zw-brain-web 构建管线（归 E5）
  - 不实装 AgentRuntime T1 触发字段（归 E4）
  - 不复造数据治理 / 数据安全 / 消息中心 / API 服务网关 / 应用中心脚本管理（基线 §1.3 不做）
  - 不做 legacy retirement Wave 4 退役判定（客户上线后再说）
