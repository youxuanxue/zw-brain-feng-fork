# SPIKE — 最小内置 Agent 样本（anp-agent/v1.2），仅供 spike validate/doctor 命令
# 跑通骨架；T1 fire 时移到 fixtures/agentruntime/sample-builtin.AGENT.yaml 并附
# 真实 builtin Agent 业务定义（建议起点：governance.policy_candidate.review 或
# 类似低风险只读 capability，与架构 §8.6 T2 「选 1 个低风险 builtin Agent 转
# AGENT.yaml 形态作为 reference」对齐）。

spec: anp-agent/v1.2

metadata:
  name: sample-builtin-readonly-agent
  version: 0.0.1-spike
  description: |
    Spike-only minimum example. T1/T2 fire 时替换为真实 builtin Agent
    （建议从 governance.policy_candidate.list 等只读 capability 起步）。

# 4 个 Registry 字段——T1 fire 时由 validate 写入 Registry；spike 阶段只展示形态
runtime_spec_version: anp-agent/v1.2
agent_yaml_ref: .twin/e4-b1-agentruntime/spike/sample_AGENT.yaml
trust_level: platform  # 仅限 source_type=builtin；外部 Agent 默认 untrusted
workspace_required: false

source_type: builtin

auth:
  mode: trusted_gateway
  # mode in {static_api_key, trusted_gateway}；禁用 none

tenant_mode: single  # sd-default 单租户

context:
  memory_mode: regulated_minimal
  # memory_mode in {regulated_minimal, session_memory}；默认禁用 memory write

model:
  provider: inspur-inference-gateway
  base_url_env: ZW_BRAIN_INFERENCE_GATEWAY_URL
  api_key_env: ZW_BRAIN_INFERENCE_API_KEY
  default_model: claude-sonnet-4-7

permissions:
  scopes:
    # 仅 read-sensitive 类 capability；禁区前缀（tenant. / policy. / audit. /
    # canonical. / approval.case.decide / inference.direct）一律不能声明
    - governance.policy_candidate.list.execute
    - audit.event.query.execute

tools:
  - name: list_policy_candidates
    kind: function
    capability: governance.policy_candidate.list
    description: 列出 sd-default 待审策略候选；read-only
  - name: query_audit_events
    kind: function
    capability: audit.event.query
    description: 按 actor/skill/time 查审计事件；read-sensitive，meta-audit 自落

# === SPIKE-ONLY MARKER ===
# spike 文件后缀不变 .yaml 是为了让 T1 fire 时 cp 即可用；本节由人工 review
# 删除后才能进 fixtures/agentruntime/。Marker 防 spike 误进生产 registry：
_spike_marker:
  status: SPIKE_DO_NOT_LAND
  trigger_to_land: T1（首个真实外部 Agent 接入需求）
  delete_marker_before_landing: true
