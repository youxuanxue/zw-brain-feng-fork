schema_version: 1
id: e4-b1-agentruntime
one_liner: 审计总线生产化 + B1.1/B1.2 完整后台 + AgentRuntime 触发式落地

core_goal: |
  让 ROLE_SECURITY_AUDIT 能在 B1.1 合规与运营面看到 sd-default 真实 710 用户 / 4187 user_role /
  3633 role_resource 的审计回放、统计、异常、追责；让 B1.2 接入扩展中心能完整跑能力包审核注册、
  外部接入配置、暴露矩阵、租户策略。审计总线必须从 51 LOC stub 升级为完整事件流（write-critical
  / write-normal / read-sensitive 三级）+ 持久化 + 回放 + 索引（基线 §2.3 + §6.4 强约束）。
  AgentRuntime 触发式落地：详见 docs/approved/zw-brain-architecture.md §8.6 + docs/preflight-debt.md
  2026-05-24 entry。
  共享纪律见 .twin/README.md（撞 M0 墙路径：governance.py 候选审核 legacy_policy_mapping_candidate）。

acceptance_criteria:
  - id: AC1
    statement: 审计总线生产化——51 LOC stub 升级为完整事件流（三级分类）+ 持久化存储 + 回放 + 索引
    evidence_type: tests/integration/test_audit_bus.py 全绿 + 真实 sd-default 审计事件回放截图 + 段 audit-must-block 不报红
  - id: AC2
    statement: B1.1 合规与运营 UI + 后端——4 panel live + Playwright 可运行；调查助手不覆盖原始证据
    evidence_type: B1.1 4 panel 截图 + tests/e2e/b11_compliance.spec.ts 2 测 CI 绿 + 988+ 审计事件 live
  - id: AC3
    statement: B1.2 接入扩展中心——ROLE_BUSIAUDIT 下能力包矩阵 live + 写操作 confirm 边界 + b12 e2e 实装
    evidence_type: B1.2 主流程 Playwright 冒烟（≥3 测）+ 200 manifest 矩阵
  - id: AC4
    statement: AgentRuntime 触发式落地预案就绪——T1/T2/T3 任一触发当日 1 天内可 land（按架构 §8.6 + preflight-debt 2026-05-24 entry 已锚定的触发条件与落地范围）
    evidence_type: docs/agent-runtime-t1-readiness.md 预案文档 + 触发时 1 天 PR land 能力证明
  - id: AC5
    statement: 5 borderline B1 业务报表 sign-off 闭环——service.rating.submit / ops.{catalog,exchange,service}.*.statistics / ops.service.report.query 由业务方逐一判定 live 或 external
    evidence_type: 业务方 sign-off + status 翻转后 export_agent_contract.py --check 零漂移
  - id: AC6
    statement: 安全审计员在 B1.1 跑通 sd-default 真实数据审计回放 + B1.2 跑通真实能力包审核注册，业务方 sign-off
    evidence_type: 验收脚本退出码 0 + 业务方 sign-off（PR comment 或 issue label `business-signoff`）

non_goals:
  - 不做 J1/J2 旅程主体（归 E1/E2）
  - 不做 Wave 2 三引擎数据模型/引擎本身（归 E3）
  - 不实装 AgentRuntime 在 T1/T2/T3 未触发前的代码（架构 §8.6 反"提前盖楼"）
  - 不重做 zw-brain-web 构建管线（E5 已 land；e2e harness 归 E5 F12）
  - 不接外部消息中心 / 集团运维监控 / 区块链 / 国家通道（归 E6/M0 + 基线 §3.4 外部依赖）
