schema_version: 1
id: e2-j2-journey
one_liner: 让 J2 挂数→维数旅程支持原生 3 层默认审批 + 资源 3 物化形式 + 异议响应

core_goal: |
  后端 J2 三审 + 三物化 + 重复率提醒 + customer_demo_j2 已在 main land（tests/test_wave1_j2_pipeline.py 全绿）。
  PR #106 后 **P5 浏览器面基本可用**：provider snapshot 四卡待办非零、wizard/inbox 子路由实装、异议收件箱 7 条 live（Playwright p5_b12_unlock + webui_smoke 26 passed）。
  仍待：**发布流重复率提醒浏览器可见**（AC2 UI 证据）、**业务方 sign-off**（F6）。
  让 ROLE_ORGAN_MANAGER 在 P5 能完成：编制 → 挂接（table/file/api）→ 部门审 → 平台复核 → 发布（含重复率提醒）→ 异议响应。
  项目级流程定制仍归 E3 三引擎。
  共享纪律见 .twin/README.md（撞 M0 墙路径：catalog_metadata.py / exchange.py / projections.py provider 段）。

acceptance_criteria:
  - id: AC1
    statement: J2 原生 3 层默认审批流程闭环（部门内审 → 平台复核 → 发布），能在 sd-default 真实目录数据上跑通
    evidence_type: tests/test_wave1_j2_pipeline.py 全绿 + 真实目录从编制到发布的 audit_event 链
  - id: AC2
    statement: 资源 3 物化 + 重复率提醒；P5 UI 可见提醒（非仅后端）
    evidence_type: 3 物化 e2e + P5 发布流重复率提醒截图
  - id: AC3
    statement: J2 异议响应面（P5 嵌入）提供方接收→响应→评价闭环
    evidence_type: Playwright P5 异议面 + tests/e2e objection_provider_response 可运行
  - id: AC4
    statement: 国家扩展要素目录编制 IA 占位 + manifest deferred:wave-3，preflight 段 22 防回潮
    evidence_type: manifest 标 deferred + tests/test_capability_boundary.py 防回潮用例新增
  - id: AC5
    statement: 业务方在 sd-default 真实数据上签字"J2 提供方日常旅程可用"
    evidence_type: 验收脚本退出码 0 + 业务方 sign-off（PR comment 或 issue label `business-signoff`）

non_goals:
  - 不做 J1 申请/审批/交付（归 E1）
  - 不做项目级审批流定制（归 E3 Wave 2 三引擎）
  - 不做表单 schema 化（归 E3）
  - 不做 B1 后台（归 E4）
  - 不实装国家扩展要素目录编制业务逻辑（仅 IA 占位）
