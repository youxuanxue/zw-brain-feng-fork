schema_version: 1
id: e2-j2-journey
one_liner: 让 J2 挂数→维数旅程支持原生 3 层默认审批 + 资源 3 物化形式 + 异议响应

core_goal: |
  消费 M0 一次性迁移产出的 sd-default canonical（dump-data_resource 7 表 + dump-dsp_catalog 161 表
  中的资源/字段/物化绑定），让 ROLE_ORGAN_OPERATER 操作员能在 P5 提供方管理面：
  在线编制目录 → 资源挂接（table/file/api 3 种物化形式）→ 部门管理员（ROLE_ORGAN_MANAGER）审 →
  平台业审（ROLE_BUSIAUDIT）复核 → 发布（含重复率检测提醒，非硬拦）→
  接收使用方异议 → 响应 → 评价归档。本期实现"原生 3 层默认流程"，项目级流程定制由 E3 三引擎承接。
  共享纪律见 .twin/README.md（撞 M0 墙路径：catalog_metadata.py / exchange.py）。

acceptance_criteria:
  - id: AC1
    statement: J2 原生 3 层默认审批流程闭环（部门内审 → 平台复核 → 发布），能在 sd-default 真实目录数据上跑通
    evidence_type: tests/test_wave1_j2_pipeline.py 全绿 + 真实目录从编制到发布的 audit_event 链
  - id: AC2
    statement: 资源 3 物化形式（table/file/api）字段绑定完整性 + 发布时重复率检测提醒（非硬拦）
    evidence_type: 3 种物化形式各一个真实资源发布 e2e + 重复率提醒页面截图（含一个故意重复的资源）
  - id: AC3
    statement: J2 异议响应面（P5 嵌入）—— 提供方接收 → 响应 → 评价 闭环
    evidence_type: tests/e2e/objection_provider_response.spec.ts + P5 异议响应面截图（与 E1 F3 协作）
  - id: AC4
    statement: 国家扩展要素目录编制 IA 占位 + manifest deferred:wave-3，preflight 段 22 防回潮
    evidence_type: manifest 标 deferred + tests/test_capability_boundary.py 防回潮用例新增
  - id: AC5
    statement: 业务方在 sd-default 真实数据上签字"J2 提供方日常旅程可用"
    evidence_type: 验收脚本退出码 0 + 业务方 sign-off（PR comment 或 issue label `business-signoff`）

non_goals:
  - 不做 J1 申请/审批/交付（归 E1）
  - 不做项目级审批流定制（归 E3 Wave 2 三引擎）
  - 不做表单 schema 化（归 E3）
  - 不做 B1 后台（归 E4）
  - 不实装国家扩展要素目录编制业务逻辑（仅 IA 占位）
