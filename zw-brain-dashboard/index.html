<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>政务数据大脑 · 指挥大屏</title>
    <meta name="description" content="zw-brain read-only dashboard" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23006be6'/%3E%3Cpath d='M19 18h26v6L29 42h17v6H19v-6l16-18H19z' fill='white'/%3E%3C/svg%3E" />
    <style>
      :root {
        --b-primary: #006be6;
        --b-secondary: #009688;
        --b-primary-hover: #0056c7;
        --b-bg-page: #f2f7fd;
        --b-bg-card: #ffffff;
        --b-bg-subtle: #e8f2fc;
        --b-border: #d4e2f4;
        --b-border-strong: #b8cce8;
        --b-text: #1a1d21;
        --b-muted: #5c6370;
        --b-shadow-card: 0 2px 8px rgba(0, 80, 180, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
        background: var(--b-bg-page);
        color: var(--b-text);
        font-size: 15px;
        line-height: 1.65;
        min-height: 100vh;
      }
      /* Light service chrome: top strip only */
      .dash-chrome {
        background: #fff;
        border-bottom: 1px solid #d4e2f4;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
      }
      .dash-chrome-inner {
        max-width: 1500px;
        margin: 0 auto;
        padding: 14px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .dash-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .dash-mark {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        background: linear-gradient(145deg, var(--b-primary), #0048a8);
        box-shadow: 0 0 0 2px rgba(0, 107, 230, 0.15);
      }
      .dash-brand strong {
        display: block;
        font-size: 18px;
        color: #1a1d21;
        font-weight: 700;
      }
      .dash-brand span {
        display: block;
        margin-top: 3px;
        font-size: 13px;
        color: #5c6370;
      }
      .readonly-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #d4e2f4;
        background: #f2f7fd;
        border-radius: 999px;
        padding: 8px 13px;
        color: #006be6;
        font-size: 14px;
        font-weight: 600;
      }

      .dashboard-shell {
        max-width: 1500px;
        margin: 0 auto;
        padding: 24px;
        min-height: calc(100vh - 72px);
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(420px, 0.95fr);
        gap: 18px;
      }
      .hero-main,
      .hero-side,
      .metric-card,
      .panel,
      .chain-node {
        border: 1px solid var(--b-border);
        background: var(--b-bg-card);
        box-shadow: var(--b-shadow-card);
      }
      .hero-main,
      .hero-side {
        border-radius: 16px;
        padding: 26px;
        min-height: 300px;
      }
      .hero-main {
        background: linear-gradient(180deg, #ffffff 0%, #f7fbff 100%);
      }
      .eyebrow {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--b-primary);
      }
      h1 {
        margin: 12px 0 14px;
        max-width: 900px;
        font-size: 30px;
        line-height: 1.22;
        letter-spacing: -0.02em;
        font-weight: 700;
        color: var(--b-text);
      }
      h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        color: var(--b-text);
      }
      p {
        margin: 0;
        color: var(--b-muted);
        line-height: 1.75;
      }
      .hero-kpis {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-top: 22px;
      }
      .hero-kpis div {
        border: 1px solid var(--b-border);
        border-radius: 12px;
        background: #fff;
        padding: 16px;
      }
      .hero-kpis span,
      .metric-label,
      .chain-node span {
        display: block;
        font-size: 13px;
        color: var(--b-muted);
      }
      .hero-kpis strong,
      .metric-value {
        display: block;
        margin-top: 10px;
        font-size: 30px;
        line-height: 1;
        letter-spacing: -0.03em;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--b-primary);
      }
      .hero-side ul {
        margin: 16px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 10px;
      }
      .hero-side li {
        padding: 12px 14px;
        border-radius: 12px;
        background: var(--b-bg-subtle);
        border: 1px solid var(--b-border);
        line-height: 1.65;
        color: var(--b-text);
      }
      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin-top: 18px;
      }
      .metric-card {
        border-radius: 14px;
        padding: 16px;
      }
      .metric-card-static {
        cursor: default;
      }
      .metric-trend {
        margin-top: 8px;
        font-size: 13px;
        color: var(--b-secondary);
      }
      .content-grid {
        display: grid;
        grid-template-columns: 1.25fr 0.75fr;
        gap: 18px;
        margin-top: 18px;
      }
      .panel {
        border-radius: 16px;
        padding: 22px;
      }
      .chain-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
        margin-top: 16px;
      }
      .chain-node {
        border-radius: 12px;
        padding: 15px;
        min-height: 118px;
      }
      .chain-node span {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--b-primary);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
      }
      .chain-node strong {
        display: block;
        margin-top: 12px;
        font-size: 15px;
      }
      .chain-node em {
        display: block;
        margin-top: 6px;
        font-style: normal;
        color: var(--b-muted);
        font-size: 13px;
        line-height: 1.55;
      }
      .evidence-list {
        margin: 14px 0 0;
        padding-left: 18px;
        line-height: 1.8;
        color: var(--b-text);
      }
      .next-action,
      .owner {
        margin-top: 12px;
        font-size: 13px;
        color: var(--b-muted);
      }
      .hint-label {
        font-weight: 700;
        color: var(--b-secondary);
        margin-right: 6px;
      }
      .snapshot-banner {
        margin-top: 16px;
        padding: 11px 14px;
        border-radius: 10px;
        background: var(--b-bg-subtle);
        border: 1px solid var(--b-border);
        color: var(--b-primary);
        font-size: 14px;
      }
      @media (max-width: 1100px) {
        .hero,
        .content-grid {
          grid-template-columns: 1fr;
        }
        .hero-side {
          min-height: auto;
        }
        .hero-kpis,
        .metrics-grid,
        .chain-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 700px) {
        .dashboard-shell {
          padding: 16px;
        }
        .dash-chrome-inner {
          flex-direction: column;
          align-items: flex-start;
        }
        h1 {
          font-size: 24px;
        }
        .hero-kpis,
        .metrics-grid,
        .chain-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="dash-chrome">
      <div class="dash-chrome-inner">
        <div class="dash-brand">
          <span class="dash-mark" aria-hidden="true"></span>
          <div>
            <strong>政务数据大脑 · 指挥大屏</strong>
            <span>只读态势 · 与办事系统独立运行</span>
          </div>
        </div>
        <div class="readonly-badge" role="status">运行态势 · 只读</div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/dashboard.js"></script>
  </body>
</html>
