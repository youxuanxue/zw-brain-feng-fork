# 本地开发 PostgreSQL —— zw-brain 默认运行时后端（见 zw_brain/shared/db.py DEFAULT_PG_URL）。
#   docker compose up -d postgres   # 起库，等 healthcheck 绿
#   bash scripts/start-local.sh      # 无 env 即默认连本库
#   bash scripts/start-docker.sh     # 全容器部署（rest + postgres 同网络）
# db/user/password/port 与 DEFAULT_PG_URL 完全对齐，故无需任何 env 配置。
# 想换库：设 ZW_BRAIN_DATABASE_URL（唯一覆盖旋钮）。
#
# rest 服务默认通过 IMAGE_TAG 指定镜像（start-docker.sh 传入），
# 也可直接 docker compose build rest 本地构建。
services:
  postgres:
    image: postgres:16
    container_name: zw-brain-pg
    environment:
      POSTGRES_DB: zw_brain
      POSTGRES_USER: zw_brain
      POSTGRES_PASSWORD: zw_brain
    ports:
      - "5432:5432"
    volumes:
      - zw_brain_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zw_brain -d zw_brain"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - zw-brain-net

  rest:
    # 镜像由 start-docker.sh 通过 IMAGE_TAG 环境变量注入，外部 docker compose 调用方也可同样覆盖。
    # 本地开发 docker compose build rest 时自动构建。
    image: ${IMAGE_TAG:-zw-brain:1.0.1}
    container_name: ${CONTAINER_NAME:-zw-brain-rest}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8800}:8800"
    env_file:
      - "${ENV_FILE:-.env}"
    environment:
      # PostgreSQL 连接：同 compose network 下通过服务名访问
      # env_file 中的 ZW_BRAIN_DATABASE_URL 优先，未设时回落默认 PG 连接串
      ZW_BRAIN_DATABASE_URL: "${ZW_BRAIN_DATABASE_URL:-postgresql+psycopg://zw_brain:zw_brain@zw-brain-pg:5432/zw_brain}"
    volumes:
      - ./docs:/app/docs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zw-brain-net
    # EXTRA_HOSTS 由 start-docker.sh 通过 .compose.override.yml 动态注入，此文件不占位

networks:
  zw-brain-net:
    driver: bridge

  # D68 单一模型：独立 AgentRuntime 服务（zw-brain REST 经 HTTP 驱动）。
  #   docker compose up -d agent-runtime   # 起独立 AR；zw-brain 设 ZW_BRAIN_AGENT_RUNTIME_URL=http://localhost:8001
  # openai_compatible 适配器只读 AR 服务侧 OPENAI_COMPATIBLE_* / AGENT_RUNTIME_DEFAULT_MODEL。
  # 本地 dev 也可直接 bash scripts/start-local.sh（co-located 起 AR，无需 docker）。
  agent-runtime:
    build:
      context: .
      dockerfile: Dockerfile.agent-runtime
    image: zw-brain-agent-runtime:1.1.3
    container_name: zw-brain-agent-runtime
    environment:
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      AGENT_RUNTIME_DEFAULT_MODEL: ${AGENT_RUNTIME_DEFAULT_MODEL:-}
      # AR 内 agent 经 kind:api 回调 zw-brain（compose 内服务名）；entrypoint 渲染进 *.openapi.yaml servers
      ZW_BRAIN_REST_BASE_URL: http://zw-brain:8800
    volumes:
      # agents 单一源（只读源）：entrypoint 拷到 /app/agents 并渲染 openapi servers 后再 serve。
      - ./agents:/srv/agents-src:ro
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8001/runtime/health',timeout=2).status==200 else sys.exit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
    # dev/demo：用 agent-runtime.dev.yaml（auth none）。生产用默认 CMD（agent-runtime.yaml / trusted_gateway）。
    command: ["agent-runtime", "serve", "--config", "/app/agent-runtime.dev.yaml", "--product", "--host", "0.0.0.0", "--port", "8001"]

  # D68 单一模型：zw-brain REST（含 WebUI），经 HTTP 驱动 agent-runtime；与 AR **共读同一 agents/**。
  #   docker compose up   # 一起起 postgres + agent-runtime + zw-brain（三件套）
  # ⚠️ dev/demo 部署（dev-iam-bypass 免登录）：仅用于本地看效果。生产走 docs/deployment/docker-image-deployment.md（真 IAF/OIDC）。
  zw-brain:
    build:
      context: .
      dockerfile: Dockerfile
    image: zw-brain:latest
    container_name: zw-brain-rest
    depends_on:
      postgres:
        condition: service_healthy
      agent-runtime:
        condition: service_healthy
    environment:
      ZW_BRAIN_DATABASE_URL: postgresql+psycopg://zw_brain:zw_brain@postgres:5432/zw_brain
      ZW_BRAIN_AGENT_RUNTIME_MODE: http
      ZW_BRAIN_AGENT_RUNTIME_ENABLED: "1"
      ZW_BRAIN_AGENT_RUNTIME_URL: http://agent-runtime:8001   # 经服务名驱动独立 AR
      ZW_BRAIN_REST_HOST: 0.0.0.0
      ZW_BRAIN_REST_PORT: "8800"
      # dev/demo 免登录（覆盖镜像默认 DEPLOY_MODE=prod 的 M5 fail-closed）；生产删掉这三行 + 配真 IAF。
      ZW_BRAIN_DEPLOY_MODE: dev
      ZW_BRAIN_DEV_IAM_BYPASS: "1"
      ZW_BRAIN_DEV_IAM_BYPASS_ACK: development-only
      ZW_BRAIN_WEBUI_ALLOW_ROLE_SWITCH: "1"
    volumes:
      - ./agents:/app/agents:ro          # agents 单一源：zw-brain「列」+ AR「跑」同一 git 目录（live）
    ports:
      - "8800:8800"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8800/health',timeout=2).status==200 else sys.exit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  zw_brain_pgdata:
