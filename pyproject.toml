[project]
name = "zw-brain"
version = "0.0.0"
description = "政务大脑 — AI-native re-architecture of the legacy Inspur 一体化大数据平台"
requires-python = ">=3.10"
authors = [{ name = "Inspur Cloud — 海若产品部", email = "zw-brain@inspur.com" }]
license = { text = "Proprietary" }
readme = "README.md"

# Phase-0 has zero runtime dependencies on purpose — web framework + orchestrator
# choices are deferred to Phase-0 PoC per design baseline D19.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zw_brain"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
