[project]
name = "zw-brain"
version = "1.0.0"
description = "政务大脑 — AI-native re-architecture of the legacy Inspur 一体化大数据平台"
requires-python = ">=3.11"  # `from datetime import UTC` (3.11+); 3.10 is EOL Oct 2026
authors = [{ name = "Inspur Cloud — 海若产品部", email = "zw-brain@inspur.com" }]
license = { text = "Proprietary" }
readme = "docs/deployment/sd-default-onboarding.md"
dependencies = [
  "SQLAlchemy>=2.0",
  "alembic>=1.18",
  "PyJWT[crypto]>=2.10",
]

[project.scripts]
zw-brain-cli = "zw_brain.entry.cli.main:main"
zw-brain-rest = "zw_brain.entry.rest.server:main"
zw-brain-dashboard-bff = "zw_brain.entry.dashboard_bff:main"
zw-brain-mcp = "zw_brain.entry.mcp.server:main"
zw-brain-a2a = "zw_brain.entry.a2a.server:main"
zw-brain-migrate-legacy = "zw_brain.entry.legacy_migration.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",      # CVE-2025-71176 fixed in 9.0.3
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zw_brain"]
include = [
  "zw_brain/entry/rest/openapi.json",
  "zw_brain/entry/mcp/tools/*.json",
  "zw_brain/entry/a2a/agent_card.json",
  "zw_brain/entry/a2a/tools/*.json",
  "zw_brain/skill_registration/registered/*.json",
  "zw_brain/domain/seed_snapshot.json",
]

[tool.hatch.build.targets.wheel.force-include]
"alembic" = "zw_brain/_assets/alembic"
"alembic.ini" = "zw_brain/_assets/alembic.ini"
"zw-brain-web" = "zw_brain/_assets/zw-brain-web"
"zw-brain-dashboard" = "zw_brain/_assets/zw-brain-dashboard"

[tool.ruff]
line-length = 200          # Chinese-text codebase — 110 too tight, 200 keeps docstrings + JSON literals readable
target-version = "py311"
force-exclude = true
extend-exclude = ["zw-brain-web/js/pages.js"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501 (line too long): Chinese-text code + dict-returning JSON serializers
#   naturally exceed 200 chars; line-length above is a soft preference, not
#   a hard wall. Real bugs (F-codes, B-codes) still fire.
# F841 on argparse `args = parser.parse_args()` — call has side effects (validation),
#   the name is conventional even when unused.
ignore = ["E501", "F841"]

[tool.ruff.lint.per-file-ignores]
# Preflight checks + dashboard BFF intentionally manipulate sys.path before
# importing the project package — that's the whole point.
"scripts/check_*.py" = ["E402"]
"scripts/export_agent_contract.py" = ["E402"]
"zw-brain-dashboard/bff/main.py" = ["E402"]
"zw_brain/command/brain.py" = ["E402"]   # `import os as _os` placed after other imports for clarity

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not legacy_migration_acceptance and not browser_e2e\""
# pytest 9 dropped the legacy auto-rootdir-on-sys.path behavior; declare the
# project root explicitly so `from zw_brain.* import ...` works in tests.
pythonpath = ["."]
markers = [
  "legacy_migration_acceptance: one-time real legacy dump migration acceptance; requires old/10示例数据 and is excluded from default pytest",
  "browser_e2e: real browser end-to-end validation; requires local Chrome/DevTools and is excluded from default pytest",
]
