# gitleaks 配置 — zw-brain 项目级 allowlist
#
# 设计原则：
# - 继承 gitleaks 默认规则集（覆盖 AWS / Stripe / GitHub Token 等真实密钥模式）
# - 仅 allowlist 本项目演示 / 文档约定中的 *明确 demo 标识* 模式，不放过任何
#   形态像真密钥的字符串。
# - 两类非生产凭据标识，与真实网关密钥形态可视区分：
#     · `AK-DEMO-*` / `SK-DEMO-*`：历史演示 / 测试断言中的占位串（诚实化后运行时已不再签发）。
#     · `AK-SELF-*` / `SK-SELF-*`：平台自签真实凭据前缀（derive_platform_credential，
#        SHA 派生确定值，非网关真密钥）——审批通过自动签发，会出现在样例渲染 / e2e 输出。
# - 真实网关密钥（dsp_service.api_service_app.SECRET）走 secret manager，绝不进本仓库。
[extend]
useDefault = true

[allowlist]
description = "项目级 demo 凭据 + dev IAM bypass 占位密钥"
regexes = [
  # 历史演示 / 测试占位 App Key（运行时已停签，仅余断言/文档字面）
  '''AK-DEMO-[A-Z0-9-]{6,}''',
  # 历史演示 App Secret（SK-DEMO- 前缀）
  '''SK-DEMO-[a-f0-9]{6,}''',
  # 平台自签真实凭据 App Key（derive_platform_credential，SHA 派生确定值，非网关真密钥）
  '''AK-SELF-[A-Z0-9-]{6,}''',
  # 平台自签 App Secret（SK-SELF- 前缀）
  '''SK-SELF-[a-f0-9]{6,}''',
  # 开发环境 IAM bypass 的 csrf_token 占位字符串
  '''dev-iam-bypass''',
]
paths = [
  # 演示 / 发布说明文档允许包含 demo 凭据示例
  '''docs/release-notes/.*''',
  # seed 数据本身就含 demo 凭据，由 .gitleaksignore 已记录的两条 fingerprint 兜底
  '''zw_brain/domain/seed_snapshot\.json''',
]
