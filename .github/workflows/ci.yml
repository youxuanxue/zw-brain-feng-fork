name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# 同分支多次 push 取消未完成的旧 run（节省 CI 分钟数；main 分支不取消）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv pip install -e '.[dev]'
      - run: ruff check .

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # PR: only 3.12 (fast path). Push-to-main: 3.11 + 3.12 (full compatibility matrix).
        # 3.11 = pyproject.toml's requires-python floor; 3.12 = stable.
        # Coverage + slow_infra tests run only on push-to-main, not on PR (saves ~6 min PR-side).
        python: ${{ (github.event_name == 'pull_request') && fromJSON('["3.12"]') || fromJSON('["3.11", "3.12"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # preflight (py3.12) needs full history for git diff origin/main;
          # py3.11 only runs tests so shallow clone is enough.
          fetch-depth: ${{ matrix.python == '3.12' && 0 || 1 }}
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: install
        run: uv pip install -e '.[dev]' build coverage
      - name: preflight
        if: matrix.python == '3.12'
        run: bash scripts/preflight.sh
      - name: pytest
        # PR: default markers (slow_infra excluded by pyproject.toml addopts), no coverage.
        # Push-to-main: explicit -m to include slow_infra; py3.12 also runs under coverage.
        # --durations=10 keeps slow-test drift visible in CI logs so future regressions surface early.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python -m pytest --durations=10
          elif [ "${{ matrix.python }}" = "3.12" ]; then
            python -m coverage run -m pytest -m "not legacy_migration_acceptance and not browser_e2e" --durations=10
            python -m coverage xml -o coverage.xml
            python -m coverage report --skip-covered --show-missing | tee coverage-summary.txt
          else
            python -m pytest -m "not legacy_migration_acceptance and not browser_e2e" --durations=10
          fi
      - name: build wheel
        if: matrix.python == '3.12'
        run: python -m build --wheel
      - name: upload coverage artifact
        if: matrix.python == '3.12' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}
          path: |
            coverage.xml
            coverage-summary.txt
          if-no-files-found: warn
          retention-days: 30

  legacy-import-smoke:
    # Spins up the import CLI on a synthetic dump produced inside the runner —
    # catches drift in MysqldumpParser / mapper dispatch / verify subcommand
    # without needing the real ~445 MB dump corpus in CI.
    name: legacy-import-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv pip install -e '.[dev]'
      - name: write tiny synthetic dump
        run: |
          mkdir -p .ci-dumps
          cat > .ci-dumps/dump-dsp_example-202604000000.sql <<'SQL'
          DROP TABLE IF EXISTS `data_example`;
          CREATE TABLE `data_example` (
            `id` varchar(36) NOT NULL,
            `example_name` varchar(255) NOT NULL,
            `org_code` varchar(64) NOT NULL,
            `org_name` varchar(128) NOT NULL,
            `region_code` varchar(36) NOT NULL,
            `region_name` varchar(255) NOT NULL,
            `field_type` varchar(255) NOT NULL,
            `example_desc` text NOT NULL,
            `process_desc` text,
            `result_desc` text,
            `visit_count` int(11) DEFAULT '0',
            `status` tinyint(2) DEFAULT NULL,
            `example_creator` varchar(32) NOT NULL,
            `create_time` datetime NOT NULL,
            `opinion` varchar(255) DEFAULT NULL,
            `push_status` char(1) DEFAULT '0',
            PRIMARY KEY (`id`)
          ) ENGINE=InnoDB;
          INSERT INTO `data_example` VALUES ('eg-1','测试案例','11370000MB284651XL','省大数据局','370000','山东省','01','smoke','do','done',1,4,'admin','2026-01-01 00:00:00','',NULL);
          SQL
      - name: parse-stats + import + verify
        env:
          ZW_BRAIN_LEGACY_DUMPS_DIR: ${{ github.workspace }}/.ci-dumps
          ZW_BRAIN_DB_PATH: ${{ runner.temp }}/smoke.db
          ZW_BRAIN_LEGACY_CACHE_DIR: ${{ runner.temp }}/legacy-cache
        run: |
          python scripts/import_legacy_dumps.py list
          python scripts/import_legacy_dumps.py parse-stats --schema dsp_example
          python scripts/import_legacy_dumps.py import dsp_example
          python scripts/import_legacy_dumps.py verify --tenant sd-default --strict

  e2e-measurement:
    # D46 测量诚实性闭环：让机器独立把「状态现算」的 e2e 轴跑出来，不再只靠工程师本地手跑。
    # 真浏览器 + 真栈（mock 推理 + dev IAM bypass），seed = 仓内已提交的真实导入派生
    # seed_snapshot.json（37KB，守 D11 零造假），**不需** 500MB dump。
    #
    # 诚实范围（绝不假绿）：committed seed 只能干净驱动 seed-light e2e 规格；dump-依赖的
    # e2e（catalog drilldown / ops invocation / national / customer_acceptance 等）留本地
    # 实跑，**不**纳入 CI allowlist —— capture 把清单外 e2e 记 e2e-not-run（fail-closed
    # 哨兵，非 pass）。CI 当**验证者不当提交者**：产物写 ci-scoped/（gitignored，不
    # commit-back，不覆盖作者本地全量采集的 canonical {sha}.json 单一事实源）。
    #
    # allowlist 现仅 twin_browser_pages.spec.ts —— 本机 seed-light 实测（fresh DB + mock +
    # bypass，:8801）该 spec 14 passed（5 角色×主路径页面真渲染无占位）。**刻意不收**
    # permission_invisibility.spec.ts：seed-light 下它 4 全 skipped（需真凭据/资源前置，
    # dump-依赖），而全 skipped 的 playwright 退出码=0 会被 capture 误记 pass = 假绿；故留
    # 本地。放量纪律：候选 spec 须在 seed-light 真 RUN 且 passed（非 skipped）才入清单。
    name: e2e + feature measurement (seed-light)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv pip install -e '.[dev]'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: build webui (vite → dist-vite，REST 直接服务)
        run: cd zw-brain-web && npm ci && npm run build
      - name: install playwright chromium
        run: npm ci && npx playwright install --with-deps chromium
      - name: start REST stack (mock 推理 + dev IAM bypass，无 dump → seed_snapshot 种子)
        env:
          ZW_BRAIN_INFERENCE_MODE: mock
          ZW_BRAIN_DEV_IAM_BYPASS: '1'
          ZW_BRAIN_DEV_IAM_BYPASS_ACK: development-only
        run: |
          set -o pipefail
          nohup python -m zw_brain.entry.rest.server > "${{ runner.temp }}/rest.log" 2>&1 &
          echo "REST_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if curl -fsS --noproxy '*' http://127.0.0.1:8800/health >/dev/null 2>&1; then
              echo "REST healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "REST failed to become healthy"; cat "${{ runner.temp }}/rest.log"; exit 1
      - name: capture feature status (--with-e2e, seed-light allowlist)
        env:
          ZW_E2E_BASE_URL: http://127.0.0.1:8800
        run: |
          set -o pipefail
          python scripts/capture_feature_status.py \
            --with-e2e --e2e-only \
            --e2e-allowlist twin_browser_pages.spec.ts \
            --captured-by "ci@${{ github.sha }}"
      - name: dump REST log on failure
        if: failure()
        run: cat "${{ runner.temp }}/rest.log" || true
