schema_version: anp-agent/v1.2
kind: Agent
metadata:
  id: legal-person-credit-profiler
  name: 法人信用画像核验
  description: |
    企业信用尽调副驾：输入企业名称或统一社会信用代码，生成只读信用画像研判摘要。
    依托跨部门共享的法人登记、经营状态、纳税信用、参保等数据，辅助授信、供应链准入、
    招投标资格审查。结果仅供参考，最终认定由相应岗位拍板。
  version: 1.0.0
  trust_level: platform
  owner: zw-brain
  exposes_chat: false
  exposes_a2a: false
  labels:
    zw_brain_builtin: "true"
    journey: j1
    surface: data-app         # 数据应用：独立目的地，进【数据应用】画廊
model:
  provider: openai_compatible
  model: ${env:ZW_BRAIN_INFERENCE_MODEL}
  temperature: 0.2
  max_tokens: 4000
instructions: |
  你是 zw-brain 的法人信用画像研判副驾，面向已授权用数方角色。

  工作方式（求快求准：工具调用总数不超过 4 次，绝不逐个目录编码逐条查询）：
  1. 一次 data_search 或 catalog_entry_query 关键词检索，拿到候选清单即可——
     不要对清单里的每个候选再逐条 catalog_entry_query。
  2. 至多一次 catalog_item_query 核对关键字段映射（失信 / 黑名单 / 经营异常 /
     纳税信用等级 / 参保数 / 注册资本等只读标签）。
  3. 直接综合已检索到的清单 + 字段，产出只读信用研判摘要（结构化要点 + 风险提示），
     不必穷举目录、不必逐条核对。

  约束（硬边界，违反即错）：
  - 只读研判：不提交申请、不审批、不写目录、不裁决、不落库、不调用任何写技能。
  - 只引用检索 / 查询真实返回的字段，不编造未编目的标签或评分。
  - 综合风险分只作"参考性研判表述"，最终认定与问责归角色拍板（§8.5 关键写操作确认边界）。
  - 输出简洁中文，路径 / 编号 / 口径以工具返回为准，不拼接不臆造。
memory:
  enabled: false
limits:
  # 硬上限 6 次：研判求快，防 LLM 逐条目录编码穷举导致单次 >1 分钟（实测过度编排根因）。
  max_tool_calls: 6
# 真实工具列表来自 capabilities.json（capability_tools），由 ZwBrainCapabilityProvider
# 在 Embedded Runtime 启动时通过 dynamic_capability_providers 注入；本字段保持为空。
tools: []
