openapi: 3.0.3
info:
  title: zw-brain 交通工程竣工交换对账只读能力
  description: 交通工程竣工交换对账在独立 AgentRuntime 进程内运行，经此 OpenAPI 把 zw-brain 已发布的只读能力声明为 kind:api 工具。
  version: 1.0.0
servers:
- url: "http://zw-brain-rest:8800"
paths:
  /api/skills/data.search:
    post:
      operationId: data_search
      summary: 数据资源检索
      description: 按关键词 / 部门 / 主题域检索共享数据资源目录，返回命中清单与结构化摘要。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: string
                  minLength: 1
                page:
                  type: integer
                  minimum: 1
                  default: 1
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                required:
                - results
                - total
                properties:
                  results:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
                    minimum: 0
  /api/skills/catalog.entry.query:
    post:
      operationId: catalog_entry_query
      summary: 查询目录条目
      description: 查询已进入 canonical 聚合的目录条目详情和列表。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                catalog_code:
                  type: string
                source:
                  type: string
                  description: filter by summary_json.source (e.g. 'reverse' for 反向编目 drafts)
                lifecycle_status:
                  type: string
                  description: filter by lifecycle_status (draft / pending_review / active / ...)
                limit:
                  type: integer
                  minimum: 1
                  description: max rows to return; filters apply in SQL before serialization
                offset:
                  type: integer
                  minimum: 0
                  description: skip rows before applying limit
                order:
                  type: string
                  enum:
                  - updated_desc
                  description: 'result ordering: ''updated_desc'' = newest updated first (work-queue view); default = catalog_code
                    ascending (stable browse order)'
                role:
                  type: string
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
  /api/skills/delivery.list:
    post:
      operationId: delivery_list
      summary: 查看交付任务列表
      description: 查看预填下发、自动汇总、回流候选和异常交付任务列表。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
  /api/skills/delivery.view:
    post:
      operationId: delivery_view
      summary: 查看交付任务
      description: 查看预填下发、自动汇总和回流候选的交付任务详情。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - task_id
              properties:
                task_id:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - status
                - history
                - backflow
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  history:
                    type: array
                    items:
                      type: object
                  backflow:
                    type: object
  /api/skills/ops.exchange.statistics.query:
    post:
      operationId: ops_exchange_statistics_query
      summary: 查询交换统计
      description: 只读查询交换、订阅和交付投影统计，不反向驱动业务状态。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resource_code:
                  type: string
                delivery_code:
                  type: string
                metric_scope:
                  type: string
                role:
                  type: string
              required: []
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
                  result:
                    type: object
                  ok:
                    type: boolean
                  summary:
                    type: object
