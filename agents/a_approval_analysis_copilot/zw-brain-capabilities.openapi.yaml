openapi: 3.0.3
info:
  title: zw-brain 审核研判副驾只读能力
  description: 审核研判副驾在独立 AgentRuntime 进程内运行，经此 OpenAPI 把 zw-brain 已发布的只读能力声明为 kind:api 工具。
  version: 1.0.0
servers:
- url: "http://127.0.0.1:8800"
paths:
  /api/skills/approval.view:
    post:
      operationId: approval_view
      summary: 查看审批详情
      description: 查看审批建议、风险、影响和异常项。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request_id
              properties:
                request_id:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - suggestion
                - actions
                properties:
                  id:
                    type: string
                  suggestion:
                    type: string
                  actions:
                    type: array
                    items:
                      type: string
  /api/skills/request.view:
    post:
      operationId: request_view
      summary: 查看申请详情
      description: 查看申请详情、差异字段、时间线与 AI 解释。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request_id
              properties:
                request_id:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - status
                - timeline
                - aiStatus
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  timeline:
                    type: array
                    items:
                      type: object
                  aiStatus:
                    type: object
  /api/skills/approval.evidence.summarize:
    post:
      operationId: approval_evidence_summarize
      summary: P3 审批依据助手（归纳依据 + 反事实 + 推荐结论）
      description: P3 审批页减摩组件。输入待审申请 id，归纳支持依据 / 反事实因素 / 推荐审批结论 (approve|return_for_fix|reject)。仅作辅助提示，绝不调用审批决策接口。zw-brain
        主进程不持有推理平台 SDK/env，当前走本地确定性规则。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                application_id:
                  type: string
                role:
                  type: string
                enabled:
                  type: boolean
                request_id:
                  type: string
              required:
              - application_id
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                properties:
                  application_id:
                    type: string
                  application_status:
                    type: string
                  bases:
                    type: array
                    items:
                      type: string
                  counter_factuals:
                    type: array
                    items:
                      type: string
                  recommendation:
                    type: string
                    description: approve | return_for_fix | reject
                  recommended_decision_reason:
                    type: string
                  historical_summary:
                    type: string
                  source:
                    type: string
                  enabled:
                    type: boolean
                  degraded:
                    type: boolean
                    description: 兼容旧客户端的可选字段；当前 zw-brain 本地规则路径不设置。
                  status:
                    type: string
                    description: not_found 时返回
                  hint:
                    type: string
  /api/skills/catalog.entry.query:
    post:
      operationId: catalog_entry_query
      summary: 查询目录条目
      description: 查询已进入 canonical 聚合的目录条目详情和列表。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                catalog_code:
                  type: string
                source:
                  type: string
                  description: filter by summary_json.source (e.g. 'reverse' for 反向编目 drafts)
                lifecycle_status:
                  type: string
                  description: filter by lifecycle_status (draft / pending_review / active / ...)
                limit:
                  type: integer
                  minimum: 1
                  description: max rows to return; filters apply in SQL before serialization
                offset:
                  type: integer
                  minimum: 0
                  description: skip rows before applying limit
                order:
                  type: string
                  enum:
                  - updated_desc
                  description: 'result ordering: ''updated_desc'' = newest updated first (work-queue view); default = catalog_code
                    ascending (stable browse order)'
                role:
                  type: string
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
  /api/skills/delivery.view:
    post:
      operationId: delivery_view
      summary: 查看交付任务
      description: 查看预填下发、自动汇总和回流候选的交付任务详情。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - task_id
              properties:
                task_id:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - status
                - history
                - backflow
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  history:
                    type: array
                    items:
                      type: object
                  backflow:
                    type: object
