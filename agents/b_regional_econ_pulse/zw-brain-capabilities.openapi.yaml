openapi: 3.0.3
info:
  title: zw-brain 区域经济运行月度研判只读能力
  description: 区域经济运行月度研判在独立 AgentRuntime 进程内运行，经此 OpenAPI 把 zw-brain 已发布的只读能力声明为 kind:api 工具。
  version: 1.0.0
servers:
- url: "http://zw-brain-rest:8800"
paths:
  /api/skills/data.search:
    post:
      operationId: data_search
      summary: 数据资源检索
      description: 按关键词 / 部门 / 主题域检索共享数据资源目录，返回命中清单与结构化摘要。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: string
                  minLength: 1
                page:
                  type: integer
                  minimum: 1
                  default: 1
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                required:
                - results
                - total
                properties:
                  results:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
                    minimum: 0
  /api/skills/catalog.entry.query:
    post:
      operationId: catalog_entry_query
      summary: 查询目录条目
      description: 查询已进入 canonical 聚合的目录条目详情和列表。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                catalog_code:
                  type: string
                source:
                  type: string
                  description: filter by summary_json.source (e.g. 'reverse' for 反向编目 drafts)
                lifecycle_status:
                  type: string
                  description: filter by lifecycle_status (draft / pending_review / active / ...)
                limit:
                  type: integer
                  minimum: 1
                  description: max rows to return; filters apply in SQL before serialization
                offset:
                  type: integer
                  minimum: 0
                  description: skip rows before applying limit
                order:
                  type: string
                  enum:
                  - updated_desc
                  description: 'result ordering: ''updated_desc'' = newest updated first (work-queue view); default = catalog_code
                    ascending (stable browse order)'
                role:
                  type: string
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
  /api/skills/metadata.catalog_item.query:
    post:
      operationId: metadata_catalog_item_query
      summary: 查询目录项字段映射
      description: 查询目录项与资源 schema 字段之间的映射证据。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resource_code:
                  type: string
                catalog_code:
                  type: string
                role:
                  type: string
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
  /api/skills/ops.catalog.statistics.query:
    post:
      operationId: ops_catalog_statistics_query
      summary: 查询目录资源统计
      description: 查询目录、资源、schema 映射和质量证据的治理统计摘要。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: object
