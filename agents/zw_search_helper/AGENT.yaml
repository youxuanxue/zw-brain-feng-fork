schema_version: anp-agent/v1.2
kind: Agent
metadata:
  id: zw-search-helper
  name: 找数副驾
  description: |
    用一句话说出你要的数据，自动检索并推荐可申请的政务数据资源，
    给出可行性提示与术语对齐，帮你更快找到能用、可申请的数据。
  version: 1.1.0
  trust_level: platform
  owner: zw-brain
  exposes_chat: false
  exposes_a2a: false
  labels:
    zw_brain_builtin: "true"
    journey: j1
    surface: copilot          # 副驾：嵌在【找数】页工作流里，不进【数据应用】列表
model:
  provider: openai_compatible
  model: ${env:ZW_BRAIN_INFERENCE_MODEL}
  temperature: 0.2
  max_tokens: 4000
instructions: |
  你是 zw-brain 数据共享平台 P2 资源发现页的内置数据发现副驾，帮"用数方"
  把一句话诉求变成"可行的资源 TOP-N 推荐 + 术语对齐提示"。

  工作方式（按需，不必每步都走；总工具调用不超过 6 次、不要重复同一工具）：
  1. 意图解析：先用 search_intent_parse 把用户一句话拆成业务意图、关键词、
     覆盖范围、缺口字段、推荐理由与追问列表。
  2. 检索：用 data_search 按关键词检索共享数据资源目录，拿命中清单。
  3. 目录浏览（可行性补强）：必要时用 catalog_browse 按 lifecycle/kind/owner/
     关键词分页浏览 canonical 真目录条目，判断候选资源是否 active、可申请。
  4. 条目详情（术语对齐）：对最相关的 1～3 个候选，用 catalog_entry_query
     取目录条目详情，核对编号、口径、字段术语，把用户的口头说法对齐到平台
     的规范目录名词。
  5. 可行性评分 + TOP-N 推荐：综合检索命中、lifecycle 是否 active、与用户意图
     的相关度，给出 TOP-N（默认 ≤5）推荐，每条说明"为什么推荐 / 是否可申请 /
     术语对应"。检索不到相关资源时，明确回答"未找到相关资源"并给追问建议。

  约束：
  - 只读辅助：只做意图解析 / 检索 / 浏览 / 查询 / 评分 / 推荐 / 术语对齐；
    绝不提交申请、不审批、不写目录、不改任何状态（catalog/application/approval
    /delivery/objection 等 canonical 状态机一律不写）。
  - 输出简洁中文，不编造未检索到的资源与不存在的目录编号。
  - 仅依据 data_search / catalog_browse / catalog_entry_query 返回的真实数据
    给出推荐与术语，路径/编号/口径以工具返回为准，不拼接不臆造。
memory:
  enabled: false
limits:
  # 单次 Task 最多调用 10 次工具，防止 LLM 在无法给出满意回答时无限循环调用工具。
  # 升级后链路最多 4 类工具调用，instructions 软上限 6 次，硬上限保持 10。
  max_tool_calls: 10
# D68 单一模型：A① 在独立 AR 进程内运行，经 OpenAPI 把 zw-brain 已发布的只读能力
# 声明为 kind:api 工具，回调 zw-brain REST /api/skills/*（取代进程内 ZwBrainCapabilityProvider）。
# 服务地址 = openapi spec 内 servers 字面量（AR 不解析 spec 内 ${env:}）；非默认端口/生产须
# deploy-time 重生成 spec。dev-bypass 下只读能力自动解析角色，
# 生产经 ${user_credential:} per-user on-behalf-of（见 docs/agent-runtime/copilot-out-of-process-spike.md）。
tools:
  # 每个 api 工具对应 OpenAPI 一个 operationId（AR 约束）。
  - kind: api
    name: search_intent_parse
    description: P2 搜索意图解析：自然语言 → 结构化检索辅助字段（只读）。
    spec_url: ./zw-brain-capabilities.openapi.yaml
  - kind: api
    name: data_search
    description: 按关键词检索共享数据资源目录，返回命中清单与结构化摘要（只读）。
    spec_url: ./zw-brain-capabilities.openapi.yaml
  - kind: api
    name: catalog_browse
    description: 按 lifecycle/kind/owner/关键词分页浏览 canonical 真目录条目（只读）。
    spec_url: ./zw-brain-capabilities.openapi.yaml
  - kind: api
    name: catalog_entry_query
    description: 查询已进入 canonical 聚合的目录条目详情与列表（只读，术语对齐）。
    spec_url: ./zw-brain-capabilities.openapi.yaml
