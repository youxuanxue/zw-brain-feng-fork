openapi: 3.0.3
info:
  title: zw-brain 能力面（A① 找数副驾只读能力 · D68 单一模型）
  description: >-
    A① 在独立 AgentRuntime 进程内运行，经此 OpenAPI 把 zw-brain 已发布的只读能力
    （/api/skills/*）声明为 kind:api 工具回调 zw-brain REST。取代进程内
    ZwBrainCapabilityProvider（embedded 退役）。服务地址 = 下方 servers 字面量（AR 不解析
    spec 内 ${env:}；start-local http 形态默认 http://127.0.0.1:8800，非默认端口/生产须
    deploy-time 重生成本 spec）。dev-bypass 下 /api/skills 对只读
    能力自动解析角色；生产经 ${user_credential:} per-user on-behalf-of（见 spike §2）。
  version: "1.1.0"
servers:
  # AR 不解析 spec 内 ${env:}，故 server 为字面量；默认 = start-local http 形态的 REST
  # （http://127.0.0.1:8800）。非默认端口 / 生产部署须按真实 zw-brain REST 地址模板化
  # 生成本 spec（deploy-time templating，见 docs/agent-runtime/copilot-out-of-process-spike.md §6）。
  - url: "http://127.0.0.1:8800"
paths:
  /api/skills/data.search:
    post:
      operationId: data_search
      summary: 按关键词检索共享数据资源目录，返回命中清单与结构化摘要（只读）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 1, description: 用户一句话搜索 }
                page: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: 命中清单
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/skills/search.intent.parse:
    post:
      operationId: search_intent_parse
      summary: P2 搜索意图解析：自然语言 → 结构化检索辅助字段（只读）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, description: 用户一句话搜索 }
                enabled: { type: boolean }
      responses:
        "200":
          description: 结构化意图
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/skills/catalog.browse:
    post:
      operationId: catalog_browse
      summary: 按 lifecycle/kind/owner/关键词分页浏览 canonical 真目录条目（只读）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                page: { type: integer, minimum: 1, default: 1 }
                limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
                lifecycle:
                  type: string
                  enum: [active, approved_pending_publish, draft, pending_review, rejected, all]
                  default: active
                kind: { type: string, enum: [real, api-group, all], default: real }
                owner_org_id: { type: string }
                query: { type: string }
      responses:
        "200":
          description: 目录条目分页
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/skills/catalog.entry.query:
    post:
      operationId: catalog_entry_query
      summary: 查询已进入 canonical 聚合的目录条目详情与列表（只读，术语对齐）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string }
                catalog_code: { type: string }
                source: { type: string }
                lifecycle_status: { type: string }
                limit: { type: integer, minimum: 1 }
                offset: { type: integer, minimum: 0 }
                order: { type: string, enum: [updated_desc] }
      responses:
        "200":
          description: 目录条目详情/列表
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
