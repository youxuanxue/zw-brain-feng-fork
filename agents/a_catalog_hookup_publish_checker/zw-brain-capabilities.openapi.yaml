openapi: 3.0.3
info:
  title: zw-brain 资源挂接发布体检只读能力
  description: 资源挂接发布体检在独立 AgentRuntime 进程内运行，经此 OpenAPI 把 zw-brain 已发布的只读能力声明为 kind:api 工具。
  version: 1.0.0
servers:
- url: "http://zw-brain-rest:8800"
paths:
  /api/skills/catalog.entry.query:
    post:
      operationId: catalog_entry_query
      summary: 查询目录条目
      description: 查询已进入 canonical 聚合的目录条目详情和列表。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                catalog_code:
                  type: string
                source:
                  type: string
                  description: filter by summary_json.source (e.g. 'reverse' for 反向编目 drafts)
                lifecycle_status:
                  type: string
                  description: filter by lifecycle_status (draft / pending_review / active / ...)
                limit:
                  type: integer
                  minimum: 1
                  description: max rows to return; filters apply in SQL before serialization
                offset:
                  type: integer
                  minimum: 0
                  description: skip rows before applying limit
                order:
                  type: string
                  enum:
                  - updated_desc
                  description: 'result ordering: ''updated_desc'' = newest updated first (work-queue view); default = catalog_code
                    ascending (stable browse order)'
                role:
                  type: string
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
  /api/skills/catalog.resource.list:
    post:
      operationId: catalog_resource_list
      summary: 列目录下的资源
      description: 给定 catalog_code，钻取列出该目录关联的所有 resource_asset（一对多）。目录存在但无资源时返回空列表（诚实空态），目录不存在返回 404。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - catalog_code
              properties:
                catalog_code:
                  type: string
                page:
                  type: integer
                  minimum: 1
                  default: 1
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20
                lifecycle:
                  type: string
                role:
                  type: string
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                required:
                - catalog
                - items
                - total
                - page
                - limit
                properties:
                  catalog:
                    type: object
                  items:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
                    minimum: 0
                  page:
                    type: integer
                    minimum: 1
                  limit:
                    type: integer
                    minimum: 1
  /api/skills/catalog.resource_view:
    post:
      operationId: catalog_resource_view
      summary: 查看资源详情
      description: 查看模板或资源的覆盖率、字段和复用解释，用于 申请人 先复用模板。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - resource_id
              properties:
                resource_id:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - name
                - status
                - fields
                - coverage
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  status:
                    type: string
                  fields:
                    type: array
                    items:
                      type: string
                  coverage:
                    type: string
  /api/skills/metadata.schema.query:
    post:
      operationId: metadata_schema_query
      summary: 查询 Schema 证据
      description: 查询资源 schema 快照证据和字段结构。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resource_code:
                  type: string
                binding_code:
                  type: string
                role:
                  type: string
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
  /api/skills/metadata.catalog_item.query:
    post:
      operationId: metadata_catalog_item_query
      summary: 查询目录项字段映射
      description: 查询目录项与资源 schema 字段之间的映射证据。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resource_code:
                  type: string
                catalog_code:
                  type: string
                role:
                  type: string
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
  /api/skills/catalog.duplicate.check:
    post:
      operationId: catalog_duplicate_check
      summary: 目录重复率检测（发布前）
      description: J2 发布前对单一 catalog 做轻量重复率检测，返回 duplicate_warnings 数组供 P5 提供方管理面 UI 展示（非硬拦：调用方继续执行 publish 即可）。匹配规则：title
        完全相等的其他 catalog；同 region_code + 同 owner_org_id 的其他 catalog。不做模糊匹配 / Embedding similarity（属高级匹配，归 R14 三引擎或 ML 阶段）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                catalog_code:
                  type: string
                role:
                  type: string
              required:
              - catalog_code
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                properties:
                  catalog_code:
                    type: string
                  duplicate_warnings:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
