openapi: 3.0.3
info:
  title: zw-brain 材料免提交核验编排只读能力
  description: 材料免提交核验编排在独立 AgentRuntime 进程内运行，经此 OpenAPI 把 zw-brain 已发布的只读能力声明为 kind:api 工具。
  version: 1.0.0
servers:
- url: "http://zw-brain-rest:8800"
paths:
  /api/skills/search.intent.parse:
    post:
      operationId: search_intent_parse
      summary: P2 搜索上下文助手（意图解析 + 缺口追问 + 推荐理由）
      description: P2 资源发现页减摩组件。把用户一句话搜索拆成结构化辅助字段：业务意图、关键词、覆盖范围、缺口字段、推荐理由、追问列表。仅作辅助提示，不替代目录树 / 筛选器 / 资源详情。zw-brain 主进程不持有推理平台
        SDK/env，当前走本地确定性规则。可由调用方传 enabled=false 标记关闭。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: 用户一句话搜索语句
                role:
                  type: string
                enabled:
                  type: boolean
                  description: false 时跳过推理直接走本地规则；默认 true
                request_id:
                  type: string
                  description: 审计关联（D4）；缺省由 cap 自动生成
              required:
              - query
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                properties:
                  intent:
                    type: string
                    description: discover_resource | register_demand | query_application | unknown
                  keywords:
                    type: array
                    items:
                      type: string
                  dimension:
                    type: object
                    properties:
                      keyword:
                        type: array
                        items:
                          type: string
                      target_resource_hint:
                        type: string
                      region:
                        type: string
                  missing_fields:
                    type: array
                    items:
                      type: string
                  recommendation_reason:
                    type: string
                  follow_up_questions:
                    type: array
                    items:
                      type: string
                  source:
                    type: string
                    description: inference | fallback_rule
                  enabled:
                    type: boolean
                  degraded:
                    type: boolean
                    description: 兼容旧客户端的可选字段；当前 zw-brain 本地规则路径不设置。
  /api/skills/data.search:
    post:
      operationId: data_search
      summary: 数据资源检索
      description: 按关键词 / 部门 / 主题域检索共享数据资源目录，返回命中清单与结构化摘要。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: string
                  minLength: 1
                page:
                  type: integer
                  minimum: 1
                  default: 1
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                required:
                - results
                - total
                properties:
                  results:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
                    minimum: 0
  /api/skills/catalog.browse:
    post:
      operationId: catalog_browse
      summary: 浏览真目录条目
      description: 按 lifecycle / kind / owner / 关键词分页浏览 canonical catalog_entry。默认过滤 retired 噪声和 api-group 节点，给 WebUI 提供客户级浏览入口。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  minimum: 1
                  default: 1
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20
                lifecycle:
                  type: string
                  enum:
                  - active
                  - approved_pending_publish
                  - draft
                  - pending_review
                  - rejected
                  - all
                  default: active
                kind:
                  type: string
                  enum:
                  - real
                  - api-group
                  - all
                  default: real
                owner_org_id:
                  type: string
                query:
                  type: string
                role:
                  type: string
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - total
                - page
                - limit
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
                    minimum: 0
                  page:
                    type: integer
                    minimum: 1
                  limit:
                    type: integer
                    minimum: 1
  /api/skills/catalog.entry.query:
    post:
      operationId: catalog_entry_query
      summary: 查询目录条目
      description: 查询已进入 canonical 聚合的目录条目详情和列表。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                catalog_code:
                  type: string
                source:
                  type: string
                  description: filter by summary_json.source (e.g. 'reverse' for 反向编目 drafts)
                lifecycle_status:
                  type: string
                  description: filter by lifecycle_status (draft / pending_review / active / ...)
                limit:
                  type: integer
                  minimum: 1
                  description: max rows to return; filters apply in SQL before serialization
                offset:
                  type: integer
                  minimum: 0
                  description: skip rows before applying limit
                order:
                  type: string
                  enum:
                  - updated_desc
                  description: 'result ordering: ''updated_desc'' = newest updated first (work-queue view); default = catalog_code
                    ascending (stable browse order)'
                role:
                  type: string
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
  /api/skills/metadata.catalog_item.query:
    post:
      operationId: metadata_catalog_item_query
      summary: 查询目录项字段映射
      description: 查询目录项与资源 schema 字段之间的映射证据。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resource_code:
                  type: string
                catalog_code:
                  type: string
                role:
                  type: string
      responses:
        '200':
          description: 能力返回
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
