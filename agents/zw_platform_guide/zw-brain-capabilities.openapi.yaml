openapi: 3.0.3
info:
  title: zw-brain 平台指南只读能力
  description: >-
    平台指南 Agent 在独立 AgentRuntime 进程内运行，经此 OpenAPI 把 zw-brain 已发布的
    文档检索能力声明为 kind:api 工具。服务地址 = 下方 servers 字面量；非默认端口或生产
    部署须 deploy-time 重生成本 spec。
  version: "1.0.0"
servers:
  - url: "http://127.0.0.1:8800"
paths:
  /api/skills/platform.docs.search:
    post:
      operationId: platform_docs_search
      summary: 在 zw-brain 项目文档中按关键词检索，返回路径、标题与摘要（只读）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, description: 检索词 }
                limit: { type: integer, minimum: 1, maximum: 20 }
      responses:
        "200":
          description: 文档命中清单
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /api/skills/platform.docs.read:
    post:
      operationId: platform_docs_read
      summary: 读取指定相对路径的 Markdown 文档正文（只读）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, description: 如 deployment/docker-image-deployment.md }
                max_chars: { type: integer, minimum: 1 }
      responses:
        "200":
          description: 文档正文
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
